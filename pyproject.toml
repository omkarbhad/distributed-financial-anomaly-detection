[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-financial-anomaly-detection"
version = "1.0.0"
description = "Reproducible financial transaction anomaly detection with local and PySpark pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omkar Bhad" }]
dependencies = [
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dashboard = ["plotly>=5.24,<7", "streamlit>=1.38,<2"]
spark = ["pyspark>=3.5,<4"]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

