services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts

  dashboard:
    build: .
    command: >-
      sh -c "pip install --no-cache-dir '.[dashboard]' &&
      streamlit run src/financial_anomaly/dashboard.py --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data

